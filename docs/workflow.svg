<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do CorpAI</title>
  <desc id="desc">Fluxo do formulário até classificação, redação, revisão e decisão com Human in the Loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="28" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">CorpAI — Fluxo do Assistente Corporativo</text>
  <text x="700" y="86" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#475569">n8n + Google Gemini + Human in the Loop</text>

  <!-- main row -->
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="55" y="175" width="190" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Formulário</text>
    <text x="150" y="238" text-anchor="middle" font-size="13" fill="#64748b">entrada estruturada</text>

    <rect x="300" y="175" width="190" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="395" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Classificador</text>
    <text x="395" y="238" text-anchor="middle" font-size="13" fill="#64748b">tipo • risco • revisão</text>

    <rect x="545" y="175" width="190" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="640" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Redator</text>
    <text x="640" y="238" text-anchor="middle" font-size="13" fill="#64748b">gera a comunicação</text>

    <rect x="790" y="175" width="190" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="885" y="211" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Revisor</text>
    <text x="885" y="238" text-anchor="middle" font-size="13" fill="#64748b">qualidade • segurança</text>

    <polygon points="1090,175 1210,221 1090,267 970,221" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1090" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Revisão</text>
    <text x="1090" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">humana?</text>
  </g>

  <!-- arrows main -->
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M245 221 H292"/>
    <path d="M490 221 H537"/>
    <path d="M735 221 H782"/>
    <path d="M980 221 H992"/>
  </g>

  <!-- branches -->
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="1190" y="115" width="170" height="82" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <text x="1275" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Aprovado</text>
    <text x="1275" y="172" text-anchor="middle" font-size="13" fill="#15803d">automaticamente</text>

    <rect x="1005" y="345" width="190" height="90" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="1100" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Human in the Loop</text>
    <text x="1100" y="406" text-anchor="middle" font-size="13" fill="#c2410c">APROVAR / REJEITAR</text>

    <rect x="795" y="470" width="185" height="64" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <text x="887" y="509" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Aprovado pelo humano</text>

    <rect x="1030" y="470" width="185" height="64" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="1122" y="509" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Comunicação bloqueada</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M1185 198 C1210 175, 1215 160, 1190 156"/>
    <path d="M1090 267 V337"/>
    <path d="M1100 435 C1080 455, 970 465, 920 470"/>
    <path d="M1100 435 C1110 450, 1120 458, 1122 470"/>
  </g>

  <text x="1182" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#15803d">NÃO</text>
  <text x="1105" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c2410c">SIM</text>
</svg>
